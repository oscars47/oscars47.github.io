<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Years in research — Oscar Scholin</title>
<meta name="description" content="Fun photos">
<link rel="stylesheet" href="style.css">
<script>
  // Applied before paint so the page never flashes the wrong theme.
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>

<button id="theme-toggle" type="button" aria-label="Switch colour theme">
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"></circle>
    <path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"></path>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5z"></path>
  </svg>
</button>

<header>
  <h1><a class="home-link" href="index.html">Oscar Scholin</a></h1>
  <p class="page-title">Years in research. The people who made it possible and fun :)</p>
</header>

<main>
  <div class="page">


    <div class="gallery">

      <figure>
        <a href="images/2025-6.jpg">
          <img src="images/2025-6.jpg" alt="2025-6" loading="lazy">
        </a>
        <figcaption>Fall 2025-Summer 2026</figcaption>
      </figure>

     

    </div>

    <!-- <p class="empty-note">More to come.</p> -->

    <nav class="links back">
      <a href="index.html">&larr; Back</a>
    </nav>

  </div>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");

    function current() {
      var set = root.getAttribute("data-theme");
      if (set) return set;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  })();
</script>

</body>
</html>
